services:
  db:
    image: postgres:16-alpine
    container_name: pas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pas_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pas}
    ports:
      - "${PAS_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
